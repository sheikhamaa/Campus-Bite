version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: campusbite_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusbite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbite_pass}
      POSTGRES_DB: ${POSTGRES_DB:-campusbite_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: campusbite_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusbite_user}:${POSTGRES_PASSWORD:-campusbite_pass}@db:5432/${POSTGRES_DB:-campusbite_db}
    depends_on:
      - db

volumes:
  postgres_data:
